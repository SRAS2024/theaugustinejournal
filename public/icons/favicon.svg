  <path d="M54 6 C52 8, 50 6, 52 4" fill="none" stroke="#e8e8ed" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  <path d="M53 8 C51 10, 48 8, 51 7" fill="none" stroke="#e8e8ed" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <path d="M52 10 C50 12, 47 10, 50 9" fill="none" stroke="#e8e8ed" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <!-- Quill nib -->
  <path d="M38 50 L37 52 L39 51 Z" fill="#e8e8ed" opacity="0.8"/>
  <!-- Small ink dot -->
  <circle cx="37" cy="52" r="1" fill="#a88bd4" opacity="0.5"/>
</svg>

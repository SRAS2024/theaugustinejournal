  <path d="M44 8 L44 14 L50 14" fill="none" stroke="#d4c9a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- Faint text lines on parchment -->
  <line x1="20" y1="22" x2="40" y2="22" stroke="#d4c9a8" stroke-width="0.8" opacity="0.35"/>
  <line x1="20" y1="28" x2="44" y2="28" stroke="#d4c9a8" stroke-width="0.8" opacity="0.3"/>
  <line x1="20" y1="34" x2="42" y2="34" stroke="#d4c9a8" stroke-width="0.8" opacity="0.25"/>
  <line x1="20" y1="40" x2="38" y2="40" stroke="#d4c9a8" stroke-width="0.8" opacity="0.2"/>
  <!-- Quill pen — angled, sketched style -->
  <path d="M38 50 C40 42, 44 30, 48 18 C49 14, 52 8, 54 6"
    fill="none" stroke="#e8e8ed" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
